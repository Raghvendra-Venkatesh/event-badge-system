services:
  - type: web
    name: event-badge-system
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: event-badge-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: event-badge-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: EXPORTS_DIR
        value: /var/data/exports
      - key: EVENT_TIME_ZONE
        value: Asia/Kolkata
      - key: OPERATOR_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: event-badge-db
    databaseName: eventbadges
    user: eventbadge
    plan: 0.5c-1g
    region: singapore
